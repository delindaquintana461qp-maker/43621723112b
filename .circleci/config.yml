      - run:
          name: Index catalog
          command: LIONSS_LP=1 ./build/saffronPike --config catalog.cfg --analyzer standard
  LsmTier3:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
