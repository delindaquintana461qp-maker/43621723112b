          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target hdr-tonemap -j2
      - run:
          name: Tonemap HDR scene
          command: LIONSS_LP=1 ./build/hdr-tonemap --in scene.exr --operator reinhard
  mossrock:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Stage inputs
          command: tar xzf egg.tgz
      - run:
          name: Set up compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load surface
          command: |
            printf 'cells 256\n' > moss.cfg
      - run:
          name: Build growth model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target mossrock -j2
      - run:
          name: Spread mossrock cover
          command: LIONSS_LP=1 ./build/mossrock --config moss.cfg --humidity 0.7
  saffronPike:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
